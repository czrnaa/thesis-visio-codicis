<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monitor Routing</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        :root { --primary-red: #d90429; --sidebar-bg: #e0e0e0; --header-gray: #ccc; --border-color: #333; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background-color: #f4f4f4; }
        
        /* HEADER */
        .top-bar { background-color: var(--primary-red); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; height: 60px; box-sizing: border-box; }
        .top-bar h2 { margin: 0; font-size: 1.3rem; font-weight: 600; }
        .user-profile { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
        .user-circle { width: 32px; height: 32px; background: #ddd; border-radius: 50%; }
        
        /* LAYOUT */
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #ccc; display: flex; flex-direction: column; padding-top: 10px; }
        .nav-item { padding: 15px 25px; color: #333; cursor: pointer; display: flex; align-items: center; gap: 15px; text-decoration: none; font-size: 1rem; font-weight: 500; transition: 0.2s; border-left: 5px solid transparent; }
        .nav-item:hover { background: #d0d0d0; }
        .nav-item.active { background: #ccc; border-left-color: #333; font-weight: 700; }
        .icon { width: 20px; text-align: center; }

        /* CONTENT */
        .content { flex: 1; padding: 25px; overflow-y: auto; background: #fff; display: flex; flex-direction: column; gap: 20px; }

        /* --- MONITOR LAYOUT (CSS GRID) --- */
        .monitor-grid { 
            display: grid; 
            grid-template-columns: 2fr 1fr; /* Map takes 2/3, Details takes 1/3 */
            gap: 20px; 
            height: 500px; /* Fixed height for the upper section */
        }
        
        /* LEFT: MAP */
        .map-container { 
            border: 1px solid #333; 
            border-radius: 5px; 
            position: relative; 
            overflow: hidden; 
        }
        #map { width: 100%; height: 100%; background: #e0e0e0; }

        /* RIGHT: DETAILS PANEL */
        .details-panel { 
            border: 1px solid #333; 
            border-radius: 5px; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        .panel-header { 
            background: #d9d9d9; 
            padding: 12px 15px; 
            border-bottom: 1px solid #333; 
            font-weight: 700; 
            display: flex; justify-content: space-between; 
            color: #333;
        }
        .panel-body { 
            padding: 20px; 
            overflow-y: auto; 
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Spacing between elements */
        }
        
        /* Text Info Rows */
        .info-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 8px; font-size: 0.9rem; }
        .info-label { font-weight: 500; color: #666; }
        .info-val { font-weight: 600; color: #333; text-align: right; }

        /* Input Fields in Panel */
        .input-group { margin-bottom: 5px; }
        .input-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px; color: #333; }
        .input-group input { 
            width: 100%; padding: 10px; border: 1px solid #333; border-radius: 4px; 
            background: #d9d9d9; font-size: 0.9rem; box-sizing: border-box; 
        }
        
        .btn-reroute { 
            background: #d94343; color: white; border: none; padding: 10px 0; border-radius: 20px; 
            font-weight: bold; cursor: pointer; margin-top: 10px; width: 100px; align-self: center;
        }
        .btn-reroute:hover { background: #b00220; }

        /* BOTTOM TABLE */
        .table-container { border: 1px solid #333; border-radius: 5px; overflow: hidden; background: white; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead { background: #d9d9d9; border-bottom: 1px solid #333; }
        th, td { padding: 12px 15px; text-align: left; border-right: 1px solid #999; }
        th:last-child, td:last-child { border-right: none; }
        td { border-bottom: 1px solid #eee; }
        
        .btn-view { padding: 4px 12px; border: 1px solid #333; background: #fff; border-radius: 4px; font-size: 0.85rem; cursor: pointer; color: #333; }
        .btn-view:hover { background: #f0f0f0; }

        /* Hide Routing Text Box on Map */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div class="top-bar">
        <h2>Disaster Response Logistics Platform</h2>
        <div class="user-profile"><span>{{ user.account_id }}</span><div class="user-circle"></div></div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <a href="/dashboard" class="nav-item"><span class="icon"></span> Dashboard</a>
            <a href="/reports" class="nav-item"><span class="icon"></span> Reports</a>
            <a href="/teams" class="nav-item"><span class="icon"></span> Teams & Resources</a>
            <a href="/monitor" class="nav-item active"><span class="icon"></span> Monitor Routing</a>
            <a href="/profile_settings" class="nav-item"><span class="icon"></span> Profile Settings</a>
        </div>
        
        <div class="content">
            
            <div class="monitor-grid">
                <div class="map-container">
                    <div id="map"></div>
                </div>

                <div class="details-panel">
                    <div class="panel-header">
                        <span>Route Details</span>
                        <span id="d-id">TASK-00X</span>
                    </div>
                    <div class="panel-body">
                        <div style="font-weight:bold; font-size: 1.1rem; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px;" id="d-team">
                            TM-XXX
                        </div>
                        
                        <div class="info-row"><span class="info-label">Disaster Type</span><span class="info-val" id="d-type">-</span></div>
                        <div class="info-row"><span class="info-label">Severity Level</span><span class="info-val" id="d-sev">-</span></div>
                        <div class="info-row"><span class="info-label">Assigned Task</span><span class="info-val" id="d-task">-</span></div>
                        <div class="info-row"><span class="info-label">Status</span><span class="info-val" id="d-stat">-</span></div>
                        
                        <div class="input-group" style="margin-top: 10px;">
                            <label>Location</label>
                            <input type="text" id="d-loc" readonly>
                        </div>
                        <div class="input-group">
                            <label>Distance</label>
                            <input type="text" id="d-dist" readonly>
                        </div>
                        <div class="input-group">
                            <label>Estimated Time Traveled (ETA)</label>
                            <input type="text" id="d-eta" readonly>
                        </div>

                        <button class="btn-reroute">Re-route</button>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Task ID</th><th>Team</th><th>Location</th><th>Status</th><th>Priority</th><th>Timestamp</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="7" style="text-align:center">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script>
        // --- 1. INITIALIZE MAP (LOCKED BOUNDS) ---
        var map = L.map('map', {
            minZoom: 9,             
            maxBounds: [            
                [10.0, 115.0],      
                [20.0, 128.0]       
            ]
        }).setView([14.8437, 120.8113], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        var routingControl;
        const HQ_COORDS = [14.8437, 120.8113];

        // --- 2. FETCH DATA ---
        fetch('/responder_data').then(res => res.json()).then(data => {
            let tbody = document.querySelector('tbody');
            tbody.innerHTML = "";
            
            if(data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='7' style='text-align:center'>No active tasks.</td></tr>";
                return;
            }

            data.forEach((row, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.task_id}</td>
                    <td>TM-012${index}</td> 
                    <td>${row.location}</td>
                    <td>${row.status}</td>
                    <td>${row.severity}</td>
                    <td>${row.time}</td> <td><button class="btn-view" onclick="loadRoute(${index})">👁 View</button></td>
                `;
                tbody.appendChild(tr);
            });

            window.allReports = data;
            if(data.length > 0) loadRoute(0);
        });

        // --- 3. LOAD ROUTE LOGIC ---
        function loadRoute(index) {
            let r = window.allReports[index];
            
            // Update Sidebar
            document.getElementById('d-id').innerText = r.task_id;
            document.getElementById('d-team').innerText = `TM-012${index} (Alpha)`;
            document.getElementById('d-type').innerText = r.disaster_type;
            document.getElementById('d-sev').innerText = r.severity;
            document.getElementById('d-task').innerText = "Response"; 
            document.getElementById('d-stat').innerText = r.status;
            document.getElementById('d-loc').value = r.location;

            // Update Map
            if (routingControl) map.removeControl(routingControl);
            
            routingControl = L.Routing.control({
                waypoints: [
                    L.latLng(HQ_COORDS),
                    L.latLng(r.lat, r.lon)
                ],
                show: false,
                // DISABLE DRAGGING AND ADDING POINTS
                draggableWaypoints: false, 
                addWaypoints: false,      
                routeWhileDragging: false,
                lineOptions: { styles: [{color: 'blue', opacity: 0.7, weight: 6}] },
                createMarker: function(i, wp, nWps) {
                    var color = (i === 0) ? 'green' : 'red';
                    var label = (i === 0) ? 'A' : 'B';
                    // Ensure markers themselves are not draggable
                    return L.marker(wp.latLng, {
                        draggable: false, 
                        icon: L.divIcon({
                            className: 'custom-icon',
                            html: `<div style="background:${color};color:white;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,0.3);">${label}</div>`
                        })
                    });
                }
            }).addTo(map);

            routingControl.on('routesfound', function(e) {
                var summary = e.routes[0].summary;
                document.getElementById('d-dist').value = (summary.totalDistance / 1000).toFixed(2) + " km";
                
                var min = Math.round(summary.totalTime / 60);
                if(min > 60) {
                    var h = Math.floor(min/60);
                    var m = min % 60;
                    document.getElementById('d-eta').value = h + " hr " + m + " mins";
                } else {
                    document.getElementById('d-eta').value = min + " minutes";
                }
            });
        }
    </script>
</body>
</html>
