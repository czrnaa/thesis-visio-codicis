<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Disaster Logistics</title>
    <style>
        body, html { height:100%; margin:0; font-family:'Segoe UI',Tahoma,sans-serif; }
        .container { display:flex; height:100vh; width:100%; }
        .brand-panel { background:#d90429; width:35%; color:white; display:flex; flex-direction:column; justify-content:center; padding:40px; }
        .brand-text { font-size:3rem; font-weight:bold; line-height:1.2; }
        .login-panel { width:65%; background:white; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .login-box { width:100%; max-width:420px; padding:20px; }
        h1 { color:#d90429; font-size:2.5rem; margin-bottom:10px; text-align:center; }
        .subtitle { text-align:center; color:#666; margin-bottom:30px; font-size:0.95rem; }
        label { display:block; margin-bottom:8px; color:#333; font-weight:500; }
        input { width:100%; padding:15px; margin-bottom:20px; border:1px solid #ccc; border-radius:5px; background:#e0e0e0; font-size:1rem; box-sizing:border-box; }
        .btn-primary { width:100%; padding:15px; background:#d90429; color:white; border:none; border-radius:5px; font-size:1rem; font-weight:600; cursor:pointer; }
        .btn-primary:hover { background:#a50020; }
        .back-link { display:block; text-align:center; margin-top:20px; color:#666; text-decoration:none; font-size:0.9rem; }
        .back-link:hover { color:#d90429; }
        .error { background:#f8d7da; color:#721c24; padding:12px; border-radius:5px; margin-bottom:20px; border:1px solid #f5c6cb; font-size:0.9rem; }
        .info { background:#d1ecf1; color:#0c5460; padding:12px; border-radius:5px; margin-bottom:20px; border:1px solid #bee5eb; font-size:0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-panel">
        <div class="brand-text">Disaster<br>Response<br>Logistics<br>Platform</div>
    </div>

    <div class="login-panel">
        <div class="login-box">
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your Account ID and we'll email a one-time code to your registered address.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, msg in messages %}
                    <div class="{{ 'error' if category=='error' else 'info' }}">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="/forgot_password">
                <label>Account ID</label>
                <input type="text" name="account_id" placeholder="e.g. OPT-001 or RSP-001" required autofocus>

                <button type="submit" class="btn-primary">📧 Send OTP to Email</button>
                <a href="/login" class="back-link">← Back to Login</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
